[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dr-aad"
version = "0.1.0"
description = "Manuscript-based Descriptor-Relational Acoustic Anomaly Detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.13,<2", "torch>=2.5,<3",
  "librosa>=0.11,<0.12", "soundfile>=0.13,<0.15", "scikit-learn>=1.6,<2"
]

[project.scripts]
dr-aad = "dr_aad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
